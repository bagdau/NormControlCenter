name: normocontrolcenter
services:
  postgres:
    image: postgres:16-alpine
    container_name: normocontrol-postgres
    environment:
      POSTGRES_DB: normocontrol
      POSTGRES_USER: normo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U normo -d normocontrol"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: normocontrol-app
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3000
      DEMO_MODE: "false"
      DATABASE_URL: postgresql://normo:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/normocontrol
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET in .env}
      UPLOAD_DIR: /app/storage/uploads
      APP_URL: http://localhost:3000
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/storage/uploads
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  uploads_data:
